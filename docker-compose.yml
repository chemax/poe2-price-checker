services:
  postgres:
    image: postgres:16-alpine
    container_name: poe2pc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poe2
      POSTGRES_USER: poe2
      POSTGRES_PASSWORD: poe2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poe2 -d poe2"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
